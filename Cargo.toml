[package]
name = "genshin-auto-skipper"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Automatic dialogue skipper for Genshin Impact"
license-file = "LICENSE"
repository = "https://github.com/Toveal/genshin-auto-skipper"

[dependencies]
anyhow = "1.0"
dirs = "7"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
log = "0.4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
simplelog = "0.12"
toml = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
